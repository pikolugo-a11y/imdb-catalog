name: One-off no-prefetch migration

on:
  push:
    branches:
      - audit/vercel-prefetch-all

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vercel-prefetch-all
          fetch-depth: 0
      - name: Replace direct next/link imports
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            [ "$file" = "components/NoPrefetchLink.js" ] && continue
            python - "$file" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          s=s.replace("from 'next/link'", "from '@/components/NoPrefetchLink'")
          s=s.replace('from "next/link"', 'from "@/components/NoPrefetchLink"')
          p.write_text(s)
          PY
          done < <(find app components -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.tsx' \) -print0)
          git rm .github/workflows/prefetch-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components
          git commit -m 'fix: route all application links through no-prefetch primitive'
          git push origin HEAD:audit/vercel-prefetch-all
