name: PikoFilm · descubrir novedades IMDb

on:
  workflow_dispatch:
    inputs:
      force_once:
        description: 'Excepción controlada: ignorar cooldown una sola ejecución manual'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: pikofilm-imdb-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      FORCE_DISCOVERY_ONCE: ${{ inputs.force_once }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Discovery manual con límite semanal
        run: npm run worker:imdb-discovery
