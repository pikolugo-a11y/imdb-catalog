name: PikoFilm · descubrir novedades IMDb

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run canónico PROC-NOV-001 creado desde Novedades'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-imdb-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PROCESS_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Discovery IMDb global
        run: npm run worker:imdb-discovery
