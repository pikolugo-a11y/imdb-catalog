name: PikoFilm · despliegue Vercel producción temporal

on:
  push:
    branches: [main]
    paths:
      - 'ops/vercel-deploy-once/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_6fBCnlAa2wA8DuuJtNbVzqaC
      VERCEL_PROJECT_ID: prj_iApLZEUtSy3MTd6KT39PvagJrra2
    steps:
      - name: Validar credencial Vercel
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN no está configurado en GitHub Actions"; exit 2; }

      - name: Crear deployment de producción desde main
        shell: bash
        run: |
          payload='{"name":"imdb-catalog","project":"prj_iApLZEUtSy3MTd6KT39PvagJrra2","target":"production","gitSource":{"type":"github","repo":"imdb-catalog","ref":"main","org":"pikolugo-a11y"}}'
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload")
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("deployment_id="+str(d.get("id"))); print("url="+str(d.get("url"))); print("status="+str(d.get("status") or d.get("readyState")))'
