name: Diagnosticar MOV-001 tt8442644

on:
  push:
    branches: [main]
    paths:
      - 'ops/diagnose/tt8442644.once'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diagnosticar hashes tt8442644
        run: node scripts/diagnose-mov001-fingerprint-once.mjs tt8442644
