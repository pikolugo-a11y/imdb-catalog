name: Revalidar MOV-001 tt8442644

on:
  push:
    branches: [main]
    paths:
      - 'ops/revalidate/tt8442644.once'

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund server-only

      - name: Revalidar únicamente tt8442644
        run: node --conditions=react-server scripts/revalidate-mov001-once.mjs tt8442644
