name: PikoFilm · comprobar acceso Neon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Validar DATABASE_URL
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL no está configurada"; exit 1; }

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verificar conexión real a la base configurada
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database() AS database,
                 current_user AS role,
                 pg_size_pretty(pg_database_size(current_database())) AS database_size,
                 version() AS postgres_version;
          SQL
