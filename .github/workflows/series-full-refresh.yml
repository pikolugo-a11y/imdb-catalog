name: PikoFilm · actualizar todas las series

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'pipeline_runs id creado por PikoFilm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-series-full-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PIPELINE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm install --ignore-scripts
      - name: Actualizar universo completo de series
        timeout-minutes: 25
        run: node worker/series-full-refresh.mjs
      - name: Registrar fallo de infraestructura
        if: ${{ failure() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL),id=Number(process.env.PIPELINE_RUN_ID||0);
          if(id){
            const [r]=await sql`SELECT status FROM pipeline_runs WHERE id=${id}`;
            if(r?.status==='running')await sql`UPDATE pipeline_runs SET status='failed',finished_at=now(),error_count=GREATEST(COALESCE(error_count,0),1),summary=COALESCE(summary,'{}'::jsonb)||'{"stage":"workflow_failed","message":"GitHub Actions terminó antes de completar el worker"}'::jsonb,updated_at=now() WHERE id=${id}`;
            try{await sql`INSERT INTO admin_events(event_type,entity_type,entity_id,action,payload,created_at) VALUES('quality','series_refresh',${String(id)},'workflow_failed','{"source":"github_actions"}'::jsonb,now())`}catch{}
          }
          NODE
