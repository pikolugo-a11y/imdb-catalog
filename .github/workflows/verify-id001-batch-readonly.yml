name: PikoFilm · verificar ID-001 Batch read-only

on:
  push:
    branches: [main]
    paths:
      - 'ops/verify-id001-batch/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Validar conexión
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL no está configurada"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Verificar último PROC-ID-001 Batch
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X <<'SQL'
          BEGIN READ ONLY;
          \pset pager off
          \pset format unaligned
          \pset tuples_only on
          WITH latest AS (
            SELECT pr.run_id
            FROM process_runs pr
            JOIN batch_run_control brc ON brc.run_id = pr.run_id
            WHERE brc.process_code = 'PROC-ID-001'
              AND brc.worker_pool = 'api'
            ORDER BY pr.requested_at DESC
            LIMIT 1
          ), item AS (
            SELECT bri.*
            FROM batch_run_items bri
            JOIN latest l ON l.run_id = bri.batch_run_id
            ORDER BY bri.position
            LIMIT 1
          ), child AS (
            SELECT pr.*
            FROM process_runs pr
            JOIN item i ON i.child_run_id = pr.run_id
          ), child_error AS (
            SELECT pre.*
            FROM process_run_errors pre
            JOIN child c ON c.run_id = pre.run_id
            ORDER BY pre.occurred_at DESC
            LIMIT 1
          )
          SELECT jsonb_pretty(jsonb_build_object(
            'parent', jsonb_build_object(
              'run_id', p.run_id,
              'technical_status', p.technical_status,
              'functional_result', p.functional_result,
              'items_total', p.items_total,
              'items_processed', p.items_processed,
              'items_succeeded', p.items_succeeded,
              'items_failed', p.items_failed,
              'items_pending', p.items_pending,
              'external_calls', p.external_calls,
              'requested_at', p.requested_at,
              'finished_at', p.finished_at,
              'desired_state', brc.desired_state,
              'pause_reason', brc.pause_reason,
              'closed_at', brc.closed_at
            ),
            'item', jsonb_build_object(
              'item_id', i.item_id,
              'entity_id', i.entity_id,
              'status', i.status,
              'attempt_count', i.attempt_count,
              'child_run_id', i.child_run_id,
              'last_error', i.last_error,
              'started_at', i.started_at,
              'finished_at', i.finished_at
            ),
            'child', jsonb_build_object(
              'run_id', c.run_id,
              'technical_status', c.technical_status,
              'functional_result', c.functional_result,
              'external_calls', c.external_calls,
              'error_count', c.error_count,
              'executor', c.executor,
              'before', c.before_compact,
              'after', c.after_compact,
              'finished_at', c.finished_at
            ),
            'error', CASE WHEN e.error_id IS NULL THEN NULL ELSE jsonb_build_object(
              'message', e.message,
              'step', e.step,
              'source', e.source,
              'retryable', e.retryable,
              'occurred_at', e.occurred_at
            ) END,
            'catalog', jsonb_build_object(
              'imdb_id', m.imdb_id,
              'tmdb_id', m.tmdb_id,
              'lifecycle_state', cl.lifecycle_state,
              'blocking_reason', cl.blocking_reason
            )
          ))
          FROM latest l
          JOIN process_runs p ON p.run_id = l.run_id
          JOIN batch_run_control brc ON brc.run_id = l.run_id
          LEFT JOIN item i ON true
          LEFT JOIN child c ON true
          LEFT JOIN child_error e ON true
          LEFT JOIN movies m ON m.imdb_id = i.entity_id
          LEFT JOIN catalog_lifecycle cl ON cl.imdb_id = i.entity_id;
          ROLLBACK;
          SQL
