name: PikoFilm · reanalizar identidad completa

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'pipeline_runs id creado por PikoFilm'
        required: true
        type: string
      mode:
        description: 'full o brave_test'
        required: false
        default: 'full'
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-identity-full-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIPELINE_RUN_ID: ${{ inputs.run_id }}
      IDENTITY_RUN_MODE: ${{ inputs.mode }}
      PIKOFILM_URL: https://imdb-catalog-eight.vercel.app
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm install --ignore-scripts
      - name: Reanalizar identidad por bloques
        timeout-minutes: 110
        run: node worker/identity-full-refresh.mjs
      - name: Registrar fallo de infraestructura
        if: ${{ failure() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL),id=Number(process.env.PIPELINE_RUN_ID||0);
          if(id){
            const [r]=await sql`SELECT status FROM pipeline_runs WHERE id=${id}`;
            if(r?.status==='running')await sql`UPDATE pipeline_runs SET status='failed',finished_at=now(),error_count=GREATEST(COALESCE(error_count,0),1),summary=COALESCE(summary,'{}'::jsonb)||'{"stage":"workflow_failed","message":"GitHub Actions terminó antes de completar identidad"}'::jsonb,updated_at=now() WHERE id=${id}`;
            try{await sql`INSERT INTO admin_events(event_type,entity_type,entity_id,action,payload,created_at) VALUES('identity','identity_refresh',${String(id)},'workflow_failed','{"source":"github_actions"}'::jsonb,now())`}catch{}
          }
          NODE
