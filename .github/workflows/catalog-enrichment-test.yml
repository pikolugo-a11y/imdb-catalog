name: PikoFilm · prueba enriquecimiento 1 título

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: 'IMDb ID (ej. tt0133093)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-catalog-enrichment-single
  cancel-in-progress: false

jobs:
  dry-run-one-title:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      TEST_IMDB_ID: ${{ inputs.imdb_id }}
    steps:
      - name: Validar IMDb ID
        shell: bash
        run: |
          if [[ ! "$TEST_IMDB_ID" =~ ^tt[0-9]+$ ]]; then
            echo "IMDb ID inválido: $TEST_IMDB_ID"
            exit 1
          fi

      - name: Checkout worker experimental
        uses: actions/checkout@v4
        with:
          ref: issue-14-worker
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Ejecutar dry-run de un único título
        run: npm run worker:test
