name: PikoFilm · actualizar ratings IMDb

on:
  workflow_dispatch:
    inputs:
      verify_imdb_id:
        description: 'IMDb ID opcional para verificar al terminar'
        required: false
        default: 'tt32454647'
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-imdb-ratings-refresh
  cancel-in-progress: false

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERIFY_IMDB_ID: ${{ inputs.verify_imdb_id }}
    steps:
      - name: Checkout worker experimental
        uses: actions/checkout@v4
        with:
          ref: issue-14-worker
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Descargar y aplicar title.ratings.tsv.gz
        run: npm run worker:imdb-ratings

      - name: Verificar título seleccionado
        if: ${{ inputs.verify_imdb_id != '' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.DATABASE_URL);
          const id = process.env.VERIFY_IMDB_ID;
          const rows = await sql`
            SELECT imdb_id, imdb_rating, imdb_votes,
                   source_snapshot->>'imdb_ratings_dataset_updated_at' AS updated_at
            FROM catalog_candidates
            WHERE imdb_id = ${id}
            LIMIT 1
          `;
          console.log(JSON.stringify(rows[0] || { imdb_id: id, found: false }, null, 2));
          NODE
