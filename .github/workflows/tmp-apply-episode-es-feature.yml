name: tmp apply SER-008 feature
on:
  push:
    branches: [feature/series-episode-es-availability]
    paths:
      - '.github/workflows/tmp-apply-episode-es-feature.yml'
      - 'tools/tmp_apply_episode_es_feature.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/series-episode-es-availability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/tmp_apply_episode_es_feature.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/calidad/series/actions.js app/calidad/series/'[ratingKey]'/page.js lib/process-display.js docs/processes/PROCESS_CATALOG.md package.json test/ser008-episode-es-availability-contract.test.mjs
          git commit -m "feat(series): disponibilidad España manual por episodio" || exit 0
          git push origin HEAD:feature/series-episode-es-availability
