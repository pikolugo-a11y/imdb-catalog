name: PikoFilm · resolver candidato IMDb manual

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: 'IMDb ID a resolver'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-imdb-manual-${{ inputs.imdb_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      IMDB_ID: ${{ inputs.imdb_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm install --ignore-scripts
      - name: Resolver candidato con datasets IMDb
        run: node worker/imdb-manual-candidate.mjs
