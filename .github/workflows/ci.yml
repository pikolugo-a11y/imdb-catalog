name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validar workers canónicos y PikoScore MDBList-only
        run: |
          node --check worker/imdb-discovery.mjs
          node --check worker/update-imdb-ratings.mjs
          node --check worker/lifecycle-pikoscore-executor.mjs
          node --check worker/lifecycle-worker.mjs
          node --check lib/lifecycle-data-stage.mjs
      - name: Validar PikoScore 3
        run: node scripts/pikoscore-v3-selfcheck.mjs
      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run build
