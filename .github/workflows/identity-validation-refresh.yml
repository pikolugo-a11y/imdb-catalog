name: PikoFilm · Validación de Identidad

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'pipeline_runs.id'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pikofilm-identity-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PIPELINE_RUN_ID: ${{ inputs.run_id }}
      PIKOFILM_URL: https://imdb-catalog-eight.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Ejecutar validación por bloques
        run: node worker/identity-validation-refresh.mjs
