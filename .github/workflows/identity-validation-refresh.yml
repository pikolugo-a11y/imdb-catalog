name: PikoFilm · Validación de Identidad

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'pipeline_runs.id'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: pikofilm-identity-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PIPELINE_RUN_ID: ${{ inputs.run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias Node mínimas
        run: npm install --ignore-scripts
      - name: FilmAffinity parser
        run: pip install --disable-pip-version-check python-filmaffinity==0.1.0
      - name: Ejecutar sesión reanudable por fases
        run: node worker/identity-validation-refresh.mjs
