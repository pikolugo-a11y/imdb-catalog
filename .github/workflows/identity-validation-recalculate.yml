name: PikoFilm · Recalcular Validación Cacheada

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'pipeline_runs.id'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: pikofilm-identity-validation
  cancel-in-progress: false

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIPELINE_RUN_ID: ${{ inputs.run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencias Node mínimas
        run: npm install --ignore-scripts
      - name: Recalcular solo datos cacheados
        run: node worker/identity-validation-recalculate.mjs
